# Set the actual reserved app name via: fly deploy --app NAME --config ...
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "examples/docs_site/Dockerfile"

[env]
  DOCS_EDITOR_ENABLED = "0"
  PHX_SERVER = "true"
  PORT = "8080"
  RELEASE_DISTRIBUTION = "none"
  ERL_AFLAGS = "+S 1:1 +A 2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/docs/index"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
